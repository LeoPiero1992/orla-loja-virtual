<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Pagamento | ORLA</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500&family=Montserrat:wght@300;400;500&display=swap');
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f7f4ef;color:#25201c;font-family:Montserrat,Arial,sans-serif;padding:24px}.card{width:min(560px,100%);background:#fff;border:1px solid #ddd7d0;padding:46px;text-align:center}.logo{width:125px;height:54px;object-fit:contain}.eyebrow{text-transform:uppercase;letter-spacing:2.4px;font-size:9px;color:#746d66;margin-top:24px}h1{font:400 48px/1 'Cormorant Garamond',Georgia,serif;margin:10px 0 16px}p{font-size:11px;line-height:1.8;color:#746d66}.button{display:inline-block;margin-top:18px;padding:14px 24px;border:1px solid #25201c;background:#25201c;color:#fff;text-decoration:none;text-transform:uppercase;letter-spacing:1.5px;font-size:9px}@media(max-width:520px){.card{padding:36px 22px}h1{font-size:40px}}
  </style>
</head>
<body><main class="card"><img class="logo" src="orla-logo.png" alt="ORLA"><div class="eyebrow" id="eyebrow">Pagamento</div><h1 id="title">Recebemos seu retorno</h1><p id="message">Aguarde enquanto conferimos o resultado do pagamento.</p><a class="button" href="index.html">Voltar para a loja</a></main><script>
  const result=new URLSearchParams(location.search).get('resultado');
  const views={sucesso:['Pagamento aprovado','Seu pagamento foi aprovado. Em breve você receberá a confirmação do pedido ORLA.'],pendente:['Pagamento em análise','O Mercado Pago está processando o pagamento. A confirmação será enviada assim que a análise terminar.'],falha:['Pagamento não concluído','O pagamento não foi aprovado ou foi cancelado. Você pode voltar à loja e tentar novamente.']};
  const view=views[result]||['Resultado do pagamento','Consulte sua conta do Mercado Pago ou fale com nosso atendimento para confirmar o pedido.'];
  title.textContent=view[0];message.textContent=view[1];
  if(result==='sucesso')localStorage.removeItem('orla_cart');
</script></body></html>
