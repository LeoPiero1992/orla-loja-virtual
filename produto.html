<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Produto | ORLA</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500&family=Montserrat:wght@300;400;500&display=swap');
:root{--ivory:#f7f4ef;--paper:#fff;--ink:#25201c;--muted:#746d66;--terr:#9e3d27;--line:#ddd7d0}*{box-sizing:border-box}body{margin:0;background:var(--ivory);color:var(--ink);font-family:Montserrat,Arial,sans-serif;font-weight:300}.top{height:34px;display:flex;align-items:center;justify-content:center;border-bottom:1px solid var(--line);font-size:9px;letter-spacing:2.3px;text-transform:uppercase}.header{height:82px;background:#fbfaf7;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:0 4vw;border-bottom:1px solid var(--line)}.header nav{display:flex;gap:25px}.header nav:last-child{justify-content:flex-end}.header a{color:inherit;text-decoration:none;text-transform:uppercase;font-size:9px;letter-spacing:1.5px}.logo{width:132px;height:58px;object-fit:contain}.crumb{max-width:1380px;margin:0 auto;padding:24px 4vw 4px;color:var(--muted);font-size:9px;letter-spacing:1px;text-transform:uppercase}.product-page{max-width:1380px;margin:auto;padding:24px 4vw 80px;display:grid;grid-template-columns:minmax(0,1.15fr) minmax(350px,.85fr);gap:6vw}.gallery{display:grid;grid-template-columns:86px 1fr;gap:16px}.thumbs{display:flex;flex-direction:column;gap:10px}.thumb{border:1px solid transparent;padding:0;background:none;cursor:pointer}.thumb.active{border-color:var(--ink)}.thumb img{display:block;width:100%;aspect-ratio:3/4;object-fit:cover}.main-image{width:100%;aspect-ratio:3/4;object-fit:cover;background:#e9e5e0}.details{padding-top:12px;position:sticky;top:20px;align-self:start}.category{font-size:9px;letter-spacing:2px;text-transform:uppercase;color:var(--muted)}h1{font:400 clamp(18px,2vw,24px)/1.35 Montserrat,Arial,sans-serif;letter-spacing:1.5px;text-transform:uppercase;margin:18px 0 12px;max-width:620px}.ref{font-size:9px;color:var(--muted);letter-spacing:1px}.price{font-size:20px;margin:27px 0 6px}.installments{font-size:10px;color:var(--muted);margin-bottom:27px}.label{font-size:10px;text-transform:uppercase;letter-spacing:1.3px;margin:20px 0 10px}.choices{display:flex;gap:8px;flex-wrap:wrap}.choice{border:1px solid var(--line);background:#fff;padding:11px 15px;cursor:pointer;font:10px Montserrat}.choice.active{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}.choice:disabled{opacity:.35;cursor:not-allowed}.size-choice{min-width:46px}.buy-row{display:grid;grid-template-columns:92px 1fr;gap:10px;margin-top:26px}.qty{display:grid;grid-template-columns:1fr 1fr 1fr;border:1px solid var(--line);background:#fff}.qty button,.qty span{border:0;background:none;display:grid;place-items:center;font-size:15px}.qty button:disabled{opacity:.3}.add{border:0;background:var(--ink);color:#fff;text-transform:uppercase;letter-spacing:1.8px;font:10px Montserrat;cursor:pointer}.add:disabled{opacity:.42;cursor:not-allowed}.shipping{margin-top:18px;padding:16px;border:1px solid var(--line);background:#fff}.shipping b{font-size:10px;text-transform:uppercase;letter-spacing:1px}.cep-row{display:grid;grid-template-columns:1fr auto;gap:8px;margin-top:10px}.cep-row input{border:1px solid var(--line);padding:12px;font:11px Montserrat}.cep-row button{border:1px solid var(--ink);background:transparent;padding:0 18px;text-transform:uppercase;font:9px Montserrat}.accordion{border-top:1px solid var(--line);margin-top:22px}.accordion details{border-bottom:1px solid var(--line);padding:17px 2px}.accordion summary{cursor:pointer;text-transform:uppercase;font-size:10px;letter-spacing:1.4px}.accordion p{font-size:11px;line-height:1.8;color:var(--muted)}.status{margin-top:12px;font-size:10px;color:var(--terr)}.back{display:inline-block;margin-top:24px;color:inherit;font-size:9px;text-transform:uppercase;letter-spacing:1.4px}.footer{background:#201b18;color:#eee;padding:45px 6vw;display:flex;justify-content:space-between;font-size:9px;letter-spacing:1px}.empty{max-width:900px;margin:80px auto;text-align:center}.image-placeholder{width:100%;aspect-ratio:3/4;background:#e7e1da;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:18px;text-transform:uppercase;letter-spacing:1.7px;font-size:9px;color:var(--muted)}.image-placeholder img{width:140px;opacity:.55}.unavailable-gallery{opacity:.38;filter:grayscale(.35)}.unavailable-message{border:1px solid #d6c9c0;background:#f4ebe5;padding:15px;margin:18px 0;text-transform:uppercase;letter-spacing:1.4px;font-size:10px;color:var(--terr)} @media(max-width:820px){.header{height:70px}.header nav a:not(:first-child){display:none}.logo{width:98px}.product-page{grid-template-columns:1fr;padding:20px 15px 60px}.gallery{grid-template-columns:1fr}.thumbs{order:2;flex-direction:row;overflow:auto}.thumb{width:72px;flex:0 0 auto}.details{position:static}.main-image{aspect-ratio:4/5}.footer{display:block}.footer span{display:block;margin:8px 0}}
h1{font-size:clamp(16px,1.65vw,20px)}
</style></head><body>
<div class="top">Frete grátis acima de R$ 500,00 para todo o Brasil</div><header class="header"><nav><a href="index.html#produtos">Coleções ORLA</a><a href="index.html#produtos">Biquínis</a><a href="index.html#produtos">Maiôs</a><a href="index.html#produtos">Saídas</a></nav><a href="index.html"><img class="logo" src="orla-logo.png" alt="ORLA"></a><nav><a href="#">Ajuda</a><a href="#">Minha conta</a><a href="checkout.html">Sacola (<span id="detailCartCount">0</span>)</a></nav></header>
<div class="crumb"><a href="index.html">Início</a> / <a href="index.html#produtos" id="crumbCollection">Coleção</a> / <span id="crumbName">Produto</span></div><main id="page"></main>
<footer class="footer"><span>ORLA — moda praia brasileira</span><span>Atendimento · Trocas e devoluções · Entregas</span></footer>
<script src="products-data.js"></script><script src="promotion-data.js"></script><script src="stock-data.js"></script><script src="composition-data.js"></script><script>
const products=window.ORLA_STORE_PRODUCTS||[],stock=window.ORLA_STORE_STOCK||{},params=new URLSearchParams(location.search),product=products.find(p=>p.ref===params.get('ref')),BRL=v=>v.toLocaleString('pt-BR',{style:'currency',currency:'BRL'}),img=id=>id.startsWith('assets/')?id:`https://lh3.googleusercontent.com/d/${id}=w1400`;function loadBag(){try{return JSON.parse(localStorage.getItem('orla_cart')||'[]')}catch{return[]}}let detailBag=loadBag(),variantIndex=-1,size='',quantity=1;function category(p){return p.category==='Top'||p.category==='Tanga'?'Biquíni':p.category}function collectionName(value){return value==='07'?'Cores de Noronha':'Aflore'}function displayRef(p){return p.ref.slice(0,3)}function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function qty(v,s){return Number(stock[product.ref+v.code+s]||0)}function variantStock(v){return v.img?v.sizes.reduce((n,s)=>n+qty(v,s),0):0}function totalStock(){return product.variants.reduce((n,v)=>n+variantStock(v),0)}function availableSizes(v){return v.img?v.sizes.filter(s=>qty(v,s)>0):[]}function isPrint(v){return Number(v.code)>10}function preferredVariant(){let first=product.variants.findIndex(v=>isPrint(v)&&variantStock(v)>0);if(first<0)first=product.variants.findIndex(v=>variantStock(v)>0);if(first<0)first=product.variants.findIndex(v=>isPrint(v)&&v.img);if(first<0)first=product.variants.findIndex(v=>v.img);return first<0?0:first}function imagesFor(v){return v.images&&v.images.length?v.images:(v.img?[v.img]:[])}function galleryMarkup(v,unavailable){let images=imagesFor(v);if(!images.length)return `<div></div><div class="image-placeholder ${unavailable?'unavailable-gallery':''}"><img src="orla-logo.png" alt="ORLA"><span>Foto em atualização</span></div>`;return `<div class="thumbs">${images.map((id,i)=>`<button class="thumb ${i===0?'active':''}" onclick="showImage('${id}',this)"><img src="${img(id)}" alt="${esc(product.name)} — ${esc(v.color)}"></button>`).join('')}</div><img class="main-image ${unavailable?'unavailable-gallery':''}" src="${img(images[0])}" alt="${esc(product.name)} — ${esc(v.color)}">`}function draw(){if(!product){page.innerHTML='<div class="empty"><h1>Produto não encontrado</h1><a href="index.html">Voltar para a loja</a></div>';return}if(!product.variants[variantIndex]||(!variantStock(product.variants[variantIndex])&&totalStock()))variantIndex=preferredVariant();let v=product.variants[variantIndex],sizes=availableSizes(v),unavailable=totalStock()===0,name=collectionName(product.collection);size=sizes.includes(size)?size:(sizes[0]||'');quantity=Math.max(1,Math.min(quantity,size?qty(v,size):1));document.title=`${product.name} | ORLA`;crumbName.textContent=product.name;crumbCollection.textContent=name;page.innerHTML=`<section class="product-page"><div class="gallery">${galleryMarkup(v,unavailable)}</div><div class="details"><div class="category">${category(product)} · ${name}</div><h1>${esc(product.name)}</h1><div class="ref">Referência: ${displayRef(product)}</div><div class="price">${BRL(v.price)}</div><div class="installments">Em até 3x de ${BRL(v.price/3)} sem juros</div>${unavailable?'<div class="unavailable-message">Indisponível no estoque</div>':''}<div class="label">Cor: <b>${v.code} — ${esc(v.color)}</b></div><div class="choices">${product.variants.map((x,i)=>`<button class="choice ${i===variantIndex?'active':''}" onclick="chooseVariant(${i})">${x.code} · ${esc(x.color)}${variantStock(x)?'':' · indisponível'}</button>`).join('')}</div><div class="label">Tamanho: <b>${size||'Indisponível'}</b></div><div class="choices">${v.sizes.map(s=>`<button class="choice size-choice ${s===size?'active':''}" onclick="chooseSize('${s}')" ${qty(v,s)&&v.img?'':'disabled'}>${s}</button>`).join('')}</div><div class="buy-row"><div class="qty"><button onclick="changeQty(-1)" ${size?'':'disabled'}>−</button><span>${size?quantity:0}</span><button onclick="changeQty(1)" ${size?'':'disabled'}>+</button></div><button class="add" onclick="addToBag()" ${size?'':'disabled'}>${size?'Adicionar à sacola':'Indisponível'}</button></div><div class="status" id="status">${size?'Disponível para pronta entrega':'Indisponível'}</div><div class="shipping"><b>Calcular frete e prazo</b><div class="cep-row"><input id="cep" inputmode="numeric" placeholder="Digite seu CEP"><button onclick="calcFreight()">Calcular</button></div><div class="status" id="freight"></div></div><div class="accordion"><details open><summary>Sobre a peça</summary><p>Peça ORLA da coleção ${name}, desenvolvida para unir conforto, elegância e liberdade de movimento. Disponível nas cores e tamanhos indicados acima.</p></details><details><summary>Composição e cuidados</summary><p>Lavar à mão, com sabão neutro e água fria. Secar à sombra. Não usar alvejante e não guardar a peça úmida.</p></details><details><summary>Trocas e devoluções</summary><p>Esta seção será conectada à política definitiva da loja antes da publicação.</p></details></div><a class="back" href="index.html#produtos">← Voltar para as coleções</a></div></section>`}function chooseVariant(i){variantIndex=i;size='';quantity=1;draw()}function chooseSize(s){size=s;quantity=1;draw()}function changeQty(n){let max=size?qty(product.variants[variantIndex],size):1;quantity=Math.max(1,Math.min(max,quantity+n));draw()}function showImage(id,button){document.querySelector('.main-image').src=img(id);document.querySelectorAll('.thumb').forEach(t=>t.classList.remove('active'));button.classList.add('active')}function updateDetailCount(){detailCartCount.textContent=detailBag.reduce((n,item)=>n+Number(item.quantity||1),0)}function addToBag(){if(!size)return;let v=product.variants[variantIndex],sku=product.ref+v.code+size,current=detailBag.filter(item=>item.sku===sku).reduce((n,item)=>n+Number(item.quantity||1),0),maximum=qty(v,size);if(current+quantity>maximum){status.textContent='Quantidade máxima disponível atingida.';return}detailBag.push({sku,ref:product.ref,name:product.name,color:v.color,size,price:v.price,quantity});localStorage.setItem('orla_cart',JSON.stringify(detailBag));updateDetailCount();status.innerHTML=`${quantity} item(ns) adicionado(s) à sacola. <a href="checkout.html">Finalizar compra</a>`}function calcFreight(){let c=cep.value.replace(/\D/g,'');freight.textContent=c.length===8?'Frete e prazo serão calculados pela integração logística da loja.':'Informe um CEP com 8 números.'}updateDetailCount();draw();
</script><script>
if(product?.ref==='10107'){
  const falesias=product.variants.findIndex(variant=>variant.code==='005'&&variant.img);
  if(falesias>=0){variantIndex=falesias;size='';quantity=1;draw()}
}
</script><script>
const compositionByReference=window.ORLA_PRODUCT_COMPOSITIONS||{};
const drawProductBase=draw;
draw=function(){
  drawProductBase();
  const composition=product&&compositionByReference[product.ref];
  const compositionParagraph=document.querySelector('.accordion details:nth-of-type(2) p');
  if(compositionParagraph&&composition){
    const parts=composition.split(' | ');
    compositionParagraph.innerHTML=`<strong>Composição:</strong><br>${parts.map(esc).join('<br>')}<br><br><strong>Cuidados:</strong><br>Lavar à mão, com sabão neutro e água fria. Secar à sombra. Não usar alvejante e não guardar a peça úmida.`;
  }else if(compositionParagraph){
    compositionParagraph.innerHTML='<strong>Cuidados:</strong><br>Lavar à mão, com sabão neutro e água fria. Secar à sombra. Não usar alvejante e não guardar a peça úmida.';
  }
};
draw();
</script></body></html>
