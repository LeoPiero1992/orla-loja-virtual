  detailBag.push({sku,ref:product.ref,name:product.name,color:variant.color,size,price:variant.price,quantity});
  localStorage.setItem('orla_cart',JSON.stringify(detailBag));
  updateDetailCount();
  if(statusNode)statusNode.innerHTML=`${quantity} item(ns) adicionado(s) à sacola. <a href="#" onclick="openDetailCart(event)">Ver sacola</a>`;
  showAddToast();
};
updateDetailCount();
</script><style id="orla-brand-toast-polish">.header .logo{filter:brightness(0) saturate(100%);opacity:.88}.add-toast{background:var(--ivory);color:var(--ink);border:1px solid var(--line);border-left:3px solid var(--terr);box-shadow:0 12px 34px #2b211b2b;font:400 12px Montserrat,Arial,sans-serif;letter-spacing:.35px}.add-toast button{color:var(--ink);font:300 24px Montserrat,Arial,sans-serif}</style><style id="orla-detail-cart">.detail-cart-shade{position:fixed;inset:0;z-index:130;background:#201b1866;opacity:0;visibility:hidden;transition:.22s}.detail-cart-shade.open{opacity:1;visibility:visible}.detail-cart-drawer{position:fixed;z-index:131;top:0;right:0;width:min(440px,100%);height:100dvh;background:#fbfaf7;box-shadow:-18px 0 45px #201b1826;transform:translateX(105%);transition:transform .26s ease;display:grid;grid-template-rows:auto 1fr auto}.detail-cart-drawer.open{transform:translateX(0)}.detail-cart-head{display:flex;align-items:center;justify-content:space-between;padding:25px 26px;border-bottom:1px solid var(--line)}.detail-cart-head small{font-size:9px;letter-spacing:2px;text-transform:uppercase;color:var(--muted)}.detail-cart-head h2{margin:5px 0 0;font:400 27px Montserrat,Arial,sans-serif;letter-spacing:1px;text-transform:uppercase}.detail-cart-head button{border:0;background:none;font:300 30px Montserrat;cursor:pointer}.detail-cart-items{overflow:auto;padding:5px 26px}.detail-cart-empty{padding:48px 0;text-align:center;color:var(--muted);font-size:12px;line-height:1.8}.detail-cart-line{display:grid;grid-template-columns:70px 1fr auto;gap:13px;padding:18px 0;border-bottom:1px solid var(--line);align-items:start}.detail-cart-line img{width:70px;height:92px;object-fit:cover;background:#e9e5e0}.detail-cart-line b{font-size:11px;font-weight:500;line-height:1.45}.detail-cart-line small{display:block;margin-top:5px;color:var(--muted);font-size:10px;line-height:1.5}.detail-cart-price{font-size:11px;white-space:nowrap}.detail-cart-actions{display:flex;align-items:center;gap:8px;margin-top:10px}.detail-cart-qty{display:grid;grid-template-columns:28px 30px 28px;border:1px solid var(--line);height:29px}.detail-cart-qty button,.detail-cart-qty span{display:grid;place-items:center;border:0;background:#fff;font:12px Montserrat}.detail-cart-remove{border:0;background:none;color:var(--terr);padding:4px;font:9px Montserrat;text-transform:uppercase;letter-spacing:.8px;cursor:pointer}.detail-cart-footer{padding:20px 26px 24px;border-top:1px solid var(--line);background:#fff}.detail-cart-total{display:flex;justify-content:space-between;align-items:center;margin-bottom:17px;font-size:12px}.detail-cart-total strong{font-size:16px}.detail-cart-checkout,.detail-cart-continue{display:block;width:100%;padding:14px;border:1px solid var(--ink);text-align:center;text-decoration:none;text-transform:uppercase;letter-spacing:1.5px;font:10px Montserrat;cursor:pointer}.detail-cart-checkout{background:var(--ink);color:#fff}.detail-cart-continue{margin-top:9px;background:transparent;color:var(--ink)}@media(max-width:520px){.detail-cart-head,.detail-cart-items,.detail-cart-footer{padding-left:18px;padding-right:18px}.detail-cart-line{grid-template-columns:62px 1fr auto}.detail-cart-line img{width:62px;height:82px}}</style><script id="orla-product-checkout-flow">const drawWithoutInstallments=draw;draw=function(){drawWithoutInstallments();document.querySelector('.details .installments')?.remove()};draw();</script><script id="orla-detail-cart-script">
function groupedDetailCart(){return Object.values(detailBag.reduce((group,item)=>{if(!group[item.sku])group[item.sku]={...item,quantity:0};group[item.sku].quantity+=Number(item.quantity||1);return group},{}))}
function detailVariantFor(item){const itemProduct=products.find(entry=>entry.ref===item.ref);return itemProduct?.variants.find(entry=>entry.color===item.color||item.sku===item.ref+entry.code+item.size)}
function detailStockLimit(item){const variant=detailVariantFor(item);return variant?Number(stock[item.ref+variant.code+item.size]||0):0}
function saveDetailBag(){localStorage.setItem('orla_cart',JSON.stringify(detailBag));updateDetailCount();renderDetailCart()}
function renderDetailCart(){const container=document.getElementById('detailCartItems'),subtotalNode=document.getElementById('detailCartSubtotal');if(!container||!subtotalNode)return;const lines=groupedDetailCart();if(!lines.length){container.innerHTML='<div class="detail-cart-empty">Sua sacola está vazia.<br>Escolha uma peça para continuar.</div>';subtotalNode.textContent=BRL(0);return}container.innerHTML=lines.map(item=>{const variant=detailVariantFor(item),image=variant?.img,photo=image?img(image):'orla-logo.png';return `<article class="detail-cart-line"><img src="${photo}" alt="${esc(item.name)} — ${esc(item.color)}"><div><b>${esc(item.name)}</b><small>Ref. ${esc(String(item.ref).slice(0,3))} · ${esc(item.color)} · ${esc(item.size)}</small><div class="detail-cart-actions"><div class="detail-cart-qty"><button type="button" onclick="changeDetailCartQuantity('${esc(item.sku)}',-1)" aria-label="Diminuir quantidade">−</button><span>${item.quantity}</span><button type="button" onclick="changeDetailCartQuantity('${esc(item.sku)}',1)" aria-label="Aumentar quantidade">+</button></div><button class="detail-cart-remove" type="button" onclick="removeDetailCartItem('${esc(item.sku)}')">Excluir</button></div></div><strong class="detail-cart-price">${BRL(Number(item.price)*item.quantity)}</strong></article>`}).join('');subtotalNode.textContent=BRL(lines.reduce((sum,item)=>sum+Number(item.price)*item.quantity,0))}
function setDetailSkuQuantity(sku,nextQuantity){const matches=detailBag.filter(item=>item.sku===sku),sample=matches[0];detailBag=detailBag.filter(item=>item.sku!==sku);if(sample&&nextQuantity>0)detailBag.push({...sample,quantity:nextQuantity});saveDetailBag()}
function changeDetailCartQuantity(sku,delta){const item=groupedDetailCart().find(entry=>entry.sku===sku);if(!item)return;const limit=detailStockLimit(item),next=Math.max(0,Math.min(limit,item.quantity+delta));if(delta>0&&next===item.quantity){showAddToast();return}setDetailSkuQuantity(sku,next)}
function removeDetailCartItem(sku){setDetailSkuQuantity(sku,0)}
function openDetailCart(event){event?.preventDefault();renderDetailCart();document.getElementById('detailCartShade')?.classList.add('open');document.getElementById('detailCartDrawer')?.classList.add('open');document.getElementById('detailCartShade')?.setAttribute('aria-hidden','false');document.getElementById('detailCartDrawer')?.setAttribute('aria-hidden','false');document.body.style.overflow='hidden'}
function closeDetailCart(){document.getElementById('detailCartShade')?.classList.remove('open');document.getElementById('detailCartDrawer')?.classList.remove('open');document.getElementById('detailCartShade')?.setAttribute('aria-hidden','true');document.getElementById('detailCartDrawer')?.setAttribute('aria-hidden','true');document.body.style.overflow=''}
const addToBagWithDrawer=addToBag;addToBag=function(){addToBagWithDrawer();renderDetailCart()};document.addEventListener('keydown',event=>{if(event.key==='Escape')closeDetailCart()});renderDetailCart();
</script><style id="orla-complete-look">.complete-look{max-width:1380px;margin:0 auto;padding:12px 4vw 88px;scroll-margin-top:94px}.complete-look-head{text-align:center;margin-bottom:34px}.complete-look-head small{font-size:10px;letter-spacing:2.5px;text-transform:uppercase;color:var(--muted)}.complete-look-head h2{font:400 24px/1.2 Montserrat,Arial,sans-serif;letter-spacing:2.5px;text-transform:uppercase;margin:10px 0}.complete-look-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:18px}.complete-look-card{display:block;background:#fff;color:inherit;text-decoration:none}.complete-look-photo{aspect-ratio:3/4;overflow:hidden;background:#e9e5e0;position:relative}.complete-look-photo img{width:100%;height:100%;object-fit:cover;transition:.4s}.complete-look-card:hover img{transform:scale(1.025)}.complete-look-info{padding:15px}.complete-look-info small{color:var(--muted);font-size:9px;letter-spacing:1.2px}.complete-look-info h3{font:400 11px/1.45 Montserrat,Arial,sans-serif;letter-spacing:1px;text-transform:uppercase;margin:8px 0}.complete-look-info strong{font-size:12px;font-weight:400}.complete-look-jump{grid-column:1/-1;justify-self:center;display:flex;align-items:center;gap:9px;margin:16px 0 2px;color:var(--ink);text-decoration:none;font-size:9px;letter-spacing:1.7px;text-transform:uppercase}.complete-look-jump b{display:grid;place-items:center;width:27px;height:27px;border:1px solid var(--line);border-radius:50%;font-size:13px;font-weight:300;transition:.25s}.complete-look-jump:hover b{background:var(--ink);border-color:var(--ink);color:#fff}@media(max-width:820px){.complete-look{padding:10px 15px 60px}.complete-look-grid{grid-template-columns:repeat(2,1fr);gap:12px}.complete-look-head h2{font-size:20px}.complete-look-jump{margin-top:12px}}</style><script id="orla-complete-look-script">
function relatedQty(item,variant,size){return Number(stock[item.ref+variant.code+size]||0)}
function relatedVariantStock(item,variant){return variant.img?variant.sizes.reduce((sum,itemSize)=>sum+relatedQty(item,variant,itemSize),0):0}
function chooseRelatedVariant(item,colorCode){let index=item.variants.findIndex(variant=>variant.code===colorCode&&relatedVariantStock(item,variant)>0);if(index<0)index=item.variants.findIndex(variant=>relatedVariantStock(item,variant)>0);if(index<0)index=item.variants.findIndex(variant=>variant.code===colorCode&&variant.img);if(index<0)index=item.variants.findIndex(variant=>variant.img);return item.variants[Math.max(0,index)]}
function relatedReferences(){if(!product)return[];const number=Number(displayRef(product)),suffix=product.collection;if(number<300){const sequence=number%100,perfect=product.category==='Tanga'?100+sequence:200+sequence,targets=[perfect,201+sequence,101+sequence,102+sequence];return [...new Set(targets.map(value=>String(value).padStart(3,'0')+suffix))].filter(ref=>ref!==product.ref).map(ref=>products.find(item=>item.ref===ref)).filter(Boolean).slice(0,4)}return products.filter(item=>item.collection===product.collection&&item.ref!==product.ref).sort((left,right)=>Number(displayRef(left))-Number(displayRef(right))).slice(0,4)}
function renderCompleteLook(){if(!product)return;let section=document.getElementById('completeLook');if(!section){section=document.createElement('section');section.id='completeLook';section.className='complete-look';page.appendChild(section)}const gallery=document.querySelector('.gallery');if(gallery&&!gallery.querySelector('.complete-look-jump'))gallery.insertAdjacentHTML('beforeend','<a class="complete-look-jump" href="#completeLook"><b>↓</b><span>Complete o look</span></a>');const currentVariant=product.variants[variantIndex]||product.variants[0],items=relatedReferences();section.innerHTML=`<div class="complete-look-head"><small>Combine do seu jeito</small><h2>Complete o look</h2></div><div class="complete-look-grid">${items.map(item=>{const variant=chooseRelatedVariant(item,currentVariant?.code),available=relatedVariantStock(item,variant)>0,photo=variant?.img?img(variant.img):'orla-logo.png';return `<a class="complete-look-card" href="produto.html?ref=${encodeURIComponent(item.ref)}"><div class="complete-look-photo"><img loading="lazy" src="${photo}" alt="${esc(item.name)} — ${esc(variant?.color||'ORLA')}"></div><div class="complete-look-info"><small>REF. ${displayRef(item)}${available?'':' · INDISPONÍVEL'}</small><h3>${esc(item.name)}</h3><strong>${BRL(Number(variant?.price||0))}</strong></div></a>`}).join('')}</div>`}
const drawWithCompleteLook=draw;draw=function(){drawWithCompleteLook();renderCompleteLook()};draw();
</script></body></html>
